<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="cmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#15203b"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#cmsBg)"/>

  <!-- Code Editor Frame -->
  <g transform="translate(80, 50)">
    <!-- Window Bar -->
    <rect x="0" y="0" width="440" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="440" height="32" rx="10" fill="#1e293b"/>
    <circle cx="18" cy="16" r="5" fill="#ef4444"/>
    <circle cx="34" cy="16" r="5" fill="#f59e0b"/>
    <circle cx="50" cy="16" r="5" fill="#10b981"/>
    <text x="220" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">DevPortfolio - CMS.php</text>

    <!-- Code Editor Content -->
    <g font-family="'JetBrains Mono', monospace" font-size="12" xml:space="preserve">
      <text x="25" y="65" fill="#818cf8">&lt;?php</text>
      <text x="25" y="90" fill="#f43f5e">class <tspan fill="#38bdf8">PortfolioManager</tspan> {</text>
      <text x="45" y="115" fill="#94a3b8">public function <tspan fill="#60a5fa">renderProjects</tspan>(PDO $pdo) {</text>
      <text x="65" y="140" fill="#fde047">$stmt = $pdo-&gt;prepare("SELECT * FROM projects");</text>
      <text x="65" y="165" fill="#34d399">$stmt-&gt;execute();</text>
      <text x="65" y="190" fill="#38bdf8">return $stmt-&gt;fetchAll();</text>
      <text x="45" y="212" fill="#94a3b8">}</text>
    </g>
  </g>

  <!-- Database & Shield Overlay Badge -->
  <g transform="translate(420, 180)">
    <circle cx="45" cy="45" r="40" fill="#1e1b4b" stroke="url(#codeGrad)" stroke-width="3"/>
    <path d="M 30 35 C 30 30, 60 30, 60 35 C 60 40, 30 40, 30 35 Z M 30 43 C 30 48, 60 48, 60 43 M 30 51 C 30 56, 60 56, 60 51" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  </g>

  <!-- UI Badge -->
  <rect x="30" y="20" width="160" height="32" rx="6" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
  <text x="110" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">DYNAMIC CMS</text>
</svg>
