<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="libBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1329"/>
      <stop offset="100%" stop-color="#181c3b"/>
    </linearGradient>
    <linearGradient id="bookGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bookGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#libBg)"/>

  <!-- Bookshelf Base -->
  <rect x="80" y="270" width="440" height="14" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>

  <!-- Digital Book Stack / Shelves -->
  <g transform="translate(100, 100)">
    <!-- Book 1 (Leaning) -->
    <g transform="rotate(-15, 40, 160)">
      <rect x="20" y="20" width="35" height="150" rx="4" fill="url(#bookGrad1)"/>
      <line x1="30" y1="40" x2="30" y2="150" stroke="#fff" stroke-width="2" opacity="0.4"/>
      <rect x="25" y="60" width="25" height="20" fill="rgba(255,255,255,0.2)"/>
    </g>
    <!-- Book 2 -->
    <rect x="75" y="10" width="30" height="160" rx="4" fill="url(#bookGrad2)"/>
    <line x1="85" y1="30" x2="85" y2="150" stroke="#fff" stroke-width="2" opacity="0.4"/>

    <!-- Book 3 -->
    <rect x="110" y="30" width="40" height="140" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="130" y="100" font-family="'JetBrains Mono', monospace" font-size="11" fill="#818cf8" transform="rotate(90, 130, 100)" text-anchor="middle">PHP 8 &amp; SQL</text>

    <!-- Open Book in Center -->
    <g transform="translate(180, 50)">
      <!-- Left Page -->
      <path d="M 0 50 Q 50 40 100 50 L 100 120 Q 50 110 0 120 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <!-- Right Page -->
      <path d="M 100 50 Q 150 40 200 50 L 200 120 Q 150 110 100 120 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <!-- Lines on pages -->
      <line x1="15" y1="65" x2="85" y2="65" stroke="#94a3b8" stroke-width="2"/>
      <line x1="15" y1="80" x2="85" y2="80" stroke="#94a3b8" stroke-width="2"/>
      <line x1="15" y1="95" x2="65" y2="95" stroke="#94a3b8" stroke-width="2"/>
      <line x1="115" y1="65" x2="185" y2="65" stroke="#94a3b8" stroke-width="2"/>
      <line x1="115" y1="80" x2="185" y2="80" stroke="#94a3b8" stroke-width="2"/>
      <line x1="115" y1="95" x2="170" y2="95" stroke="#94a3b8" stroke-width="2"/>
      <!-- Glow rays from open book -->
      <path d="M 100 45 L 80 10 M 100 45 L 100 5 M 100 45 L 120 10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- UI Badge -->
  <rect x="30" y="30" width="160" height="32" rx="6" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
  <text x="110" y="51" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">LIBRARY SYSTEM</text>
</svg>
