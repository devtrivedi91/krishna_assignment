<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="rsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>
    <linearGradient id="rsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#rsBg)"/>
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
    <line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="500" y1="0" x2="500" y2="350"/>
  </g>
  <!-- Route Line -->
  <path d="M 80 260 C 180 180, 260 280, 380 140 C 450 60, 500 130, 520 90" fill="none" stroke="url(#rsGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="8,6"/>
  
  <!-- Waypoints -->
  <circle cx="80" cy="260" r="10" fill="#38bdf8" stroke="#fff" stroke-width="3"/>
  <circle cx="380" cy="140" r="8" fill="#818cf8" stroke="#fff" stroke-width="2"/>
  <circle cx="520" cy="90" r="12" fill="#ef4444" stroke="#fff" stroke-width="3"/>

  <!-- Car Icon / Symbol -->
  <g transform="translate(220, 160)">
    <rect x="0" y="20" width="160" height="50" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 30 20 L 50 0 L 110 0 L 130 20 Z" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="35" cy="70" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="125" cy="70" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <text x="80" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">RIDESHARE</text>
  </g>
  <!-- UI Badge -->
  <rect x="30" y="30" width="140" height="32" rx="6" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
  <text x="100" y="51" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">CARPOOLING</text>
</svg>
