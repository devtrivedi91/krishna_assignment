<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="estateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#141e38"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#estateBg)"/>
  
  <!-- Subtle Moon / Accent -->
  <circle cx="480" cy="80" r="45" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3"/>
  
  <!-- Skyline / Buildings -->
  <g transform="translate(60, 90)">
    <!-- Building 1 -->
    <rect x="0" y="70" width="70" height="150" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Windows -->
    <rect x="15" y="85" width="15" height="15" fill="#fde047" opacity="0.8"/>
    <rect x="40" y="85" width="15" height="15" fill="#38bdf8" opacity="0.6"/>
    <rect x="15" y="115" width="15" height="15" fill="#38bdf8" opacity="0.6"/>
    <rect x="40" y="115" width="15" height="15" fill="#fde047" opacity="0.8"/>
    <rect x="15" y="145" width="15" height="15" fill="#fde047" opacity="0.8"/>

    <!-- Building 2 (Tower) -->
    <rect x="85" y="20" width="90" height="200" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <polygon points="85,20 130,-20 175,20" fill="#312e81" stroke="#6366f1" stroke-width="2"/>
    <line x1="130" y1="-20" x2="130" y2="-45" stroke="#38bdf8" stroke-width="3"/>
    <!-- Tower Windows -->
    <circle cx="130" cy="40" r="10" fill="#38bdf8" opacity="0.7"/>
    <rect x="105" y="70" width="18" height="25" rx="3" fill="#818cf8" opacity="0.6"/>
    <rect x="137" y="70" width="18" height="25" rx="3" fill="#818cf8" opacity="0.6"/>
    <rect x="105" y="110" width="18" height="25" rx="3" fill="#fde047" opacity="0.8"/>
    <rect x="137" y="110" width="18" height="25" rx="3" fill="#38bdf8" opacity="0.6"/>

    <!-- Building 3 (Modern Villa) -->
    <rect x="190" y="90" width="120" height="130" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="175,90 250,45 325,90" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="220" y="110" width="60" height="40" rx="4" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="240" y="170" width="25" height="50" fill="#334155"/>

    <!-- Building 4 -->
    <rect x="325" y="50" width="80" height="170" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="345" y="75" width="40" height="20" rx="2" fill="#38bdf8" opacity="0.6"/>
    <rect x="345" y="115" width="40" height="20" rx="2" fill="#818cf8" opacity="0.6"/>
    <rect x="345" y="155" width="40" height="20" rx="2" fill="#fde047" opacity="0.8"/>
  </g>
  <!-- UI Badge -->
  <rect x="30" y="30" width="140" height="32" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
  <text x="100" y="51" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#818cf8" text-anchor="middle">REAL ESTATE</text>
</svg>
