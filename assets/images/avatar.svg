<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="4" />

  <!-- Background Tech Geometry -->
  <g opacity="0.25">
    <circle cx="200" cy="200" r="150" fill="none" stroke="#38bdf8" stroke-dasharray="6,8" stroke-width="2" />
    <circle cx="200" cy="200" r="175" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <path d="M 50 200 L 350 200 M 200 50 L 200 350" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,6" />
  </g>

  <!-- Body / Hoodie -->
  <path d="M 100 395 C 100 310, 140 270, 200 270 C 260 270, 300 310, 300 395 Z" fill="#1e293b" stroke="url(#glowGrad)" stroke-width="3" />
  <!-- Hoodie Inner / Collar -->
  <path d="M 160 275 L 200 330 L 240 275 Z" fill="#0f172a" />
  <circle cx="200" cy="305" r="5" fill="#38bdf8" />

  <!-- Neck -->
  <rect x="180" y="220" width="40" height="45" rx="8" fill="#fbbf24" />

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="#fde68a" />

  <!-- Hair Modern Cut -->
  <path d="M 142 165 C 140 100, 190 90, 245 105 C 265 110, 260 145, 258 165 C 248 135, 230 130, 200 130 C 170 130, 150 145, 142 165 Z" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" />

  <!-- Glasses -->
  <rect x="160" y="165" width="32" height="24" rx="6" fill="rgba(56, 189, 248, 0.25)" stroke="#38bdf8" stroke-width="3" />
  <rect x="208" y="165" width="32" height="24" rx="6" fill="rgba(56, 189, 248, 0.25)" stroke="#38bdf8" stroke-width="3" />
  <line x1="192" y1="177" x2="208" y2="177" stroke="#38bdf8" stroke-width="3" />
  <!-- Eyes -->
  <circle cx="176" cy="177" r="4" fill="#0f172a" />
  <circle cx="224" cy="177" r="4" fill="#0f172a" />
  <!-- Smile -->
  <path d="M 188 215 Q 200 225 212 215" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />

  <!-- Headphones -->
  <path d="M 135 180 C 130 130, 150 100, 200 100 C 250 100, 270 130, 265 180" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round" />
  <rect x="132" y="165" width="12" height="30" rx="6" fill="#818cf8" />
  <rect x="256" y="165" width="12" height="30" rx="6" fill="#818cf8" />

  <!-- Code Floating Elements -->
  <g font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" opacity="0.8">
    <text x="50" y="120">&lt;/&gt;</text>
    <text x="320" y="140">{ ; }</text>
    <text x="45" y="270">PHP 8</text>
    <text x="310" y="280">MySQL</text>
  </g>
</svg>
